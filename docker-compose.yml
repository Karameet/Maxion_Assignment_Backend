services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: orders
      POSTGRES_PASSWORD: orders
      POSTGRES_DB: orders
    ports:
      - "5433:5432" # 5432 often collides with a Postgres installed on Windows
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro # creates orders_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orders"]
      interval: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@local.dev
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_DISABLE_POSTFIX: "true"
    ports:
      - "5050:80"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro

  api:
    profiles: ["api"]
    build: .
    environment:
      PORT: 8080
      APP_ENV: dev
      DATABASE_URL: postgres://orders:orders@db:5432/orders?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me-in-production-32b}
      JWT_ISSUER: order-api
      JWT_TTL: 168h
      ORDER_REPO: postgres
      ENABLE_FAULT_INJECTION: ${ENABLE_FAULT_INJECTION:-false}
      CORS_ALLOWED_ORIGINS: "*"
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  pgadmin_data:
